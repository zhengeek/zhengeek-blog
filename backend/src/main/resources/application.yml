server:
  port: 8080

spring:
  application:
    name: zhengeek-backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhengeek_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:86400}
  messages:
    notification:
      email:
        enabled: ${MESSAGE_EMAIL_ENABLED:false}
        from: ${MESSAGE_EMAIL_FROM:}
        to: ${MESSAGE_EMAIL_TO:}
      wecom:
        webhook-url: ${MESSAGE_WECOM_WEBHOOK_URL:}
